  <text x="54" y="25" font-family="'Arial Black', Arial, sans-serif" font-size="20" font-weight="900" fill="#1e2d6e">Nurses</text>
  <!-- "Pro" teal bold -->
  <text x="148" y="25" font-family="'Arial Black', Arial, sans-serif" font-size="20" font-weight="900" fill="#2ab5b0">Pro</text>
  <!-- ACADEMY small -->
  <text x="54" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1e2d6e" letter-spacing="4">ACADEMY</text>
</svg>